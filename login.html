
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALUMNEX | Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section class="intro">
    <span class="eyebrow">WELCOME BACK</span>
    <h2>Login to <span>ALUMNEX</span></h2>
    <form id="loginForm" style="max-width:400px;margin:35px auto">
        <input id="email" type="email" placeholder="Email address" required>
        <input id="password" type="password" placeholder="Password" required>
        <button class="btn-primary" style="border:0;cursor:pointer;width:100%" type="submit">Login →</button>
        <p id="message"></p>
    </form>
    <p>New member? <a href="register.html">Create account</a></p>
</section>
<script src="js/auth.js"></script>
</body>
</html>
