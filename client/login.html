
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALUMNEX | Login</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: #f4f5f9;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 42px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 55px rgba(16,28,50,.09);
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-heading h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: #101c32;
            margin-top: 20px;
        }

        .auth-heading p {
            color: #788092;
            margin-top: 10px;
        }

        .auth-form label {
            display: block;
            font-weight: 600;
            margin: 17px 0 8px;
            font-size: 13px;
        }

        .auth-form input {
            width: 100%;
            padding: 15px;
            border: 1px solid #dce0e8;
            border-radius: 7px;
            font-size: 14px;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #3157a4;
        }

        .auth-submit {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #101c32;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-submit:hover {
            background: #3157a4;
        }

        .auth-message {
            display: none;
            padding: 12px;
            margin-top: 16px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.6;
        }

        .auth-message.success {
            display: block;
            background: #e7f7ed;
            color: #16713b;
        }

        .auth-message.error {
            display: block;
            background: #fff0f0;
            color: #bd3030;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .auth-footer a {
            color: #3157a4;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-heading">
            <a href="index.html" class="logo">ALUMNEX<span>.</span></a>
            <h1>Welcome Back</h1>
            <p>Sign in to continue your journey.</p>
        </div>

        <form id="loginForm" class="auth-form">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="auth-submit" id="loginButton">
                Login to ALUMNEX →
            </button>

            <div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="register.html">Register now</a>
        </div>

        <div class="auth-footer">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
