
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALUMNEX | Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section class="intro">
    <span class="eyebrow">JOIN OUR COMMUNITY</span>
    <h2>Create your <span>Account</span></h2>

    <form id="registerForm" style="max-width:400px;margin:35px auto">
        <input id="name" placeholder="Full name" required>
        <input id="email" type="email" placeholder="Email address" required>
        <input id="password" type="password" minlength="8" placeholder="Password (minimum 8 characters)" required>
        <select id="role" required>
            <option value="">Select your role</option>
            <option value="student">Current Student</option>
            <option value="alumni">Alumni</option>
        </select>
        <button class="btn-primary" type="submit" style="border:0;cursor:pointer;width:100%">Create Account →</button>
        <p id="message"></p>
    </form>
    <p>Already registered? <a href="login.html">Login</a></p>
</section>
<script src="js/auth.js"></script>
</body>
</html>
